<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>冰岛</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:system-ui,-apple-system,sans-serif}
body{min-height:100vh;background:#0a0a12;color:#fff;overflow-x:hidden}

/* 首页容器 */
.home-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.home-card{width:100%;max-width:460px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.12);border-radius:22px;padding:36px 30px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.home-card h1{font-size:28px;font-weight:600;margin-bottom:8px;text-align:center;background:linear-gradient(135deg,#fff,#aaa);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.home-card .sub{text-align:center;opacity:.6;font-size:14px;margin-bottom:30px}
.input-group{margin-bottom:22px}
.input-group label{display:block;margin-bottom:10px;font-size:14px;opacity:.8}
#phoneInput{width:100%;padding:16px 18px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.14);border-radius:14px;color:#fff;font-size:16px;outline:none;transition:.25s border-color;letter-spacing:2px}
#phoneInput:focus{border-color:rgba(255,60,60,.5)}
#phoneInput::placeholder{opacity:.4;letter-spacing:normal}
.tip-text{font-size:13px;color:#ff5555;margin-top:10px;min-height:18px}
#confirmBtn{width:100%;padding:16px;border-radius:14px;border:none;background:linear-gradient(135deg,#d62828,#b51717);color:#fff;font-size:16px;font-weight:500;cursor:pointer;transition:.2s all;margin-top:8px}
#confirmBtn:active{transform:scale(.98)}
#confirmBtn:disabled{opacity:.4;cursor:not-allowed}

/* 内容区域 */
#contentArea{display:none;width:100%;height:100vh}
#siteFrame{width:100%;height:100%;border:none;display:block}

/* 全屏黑幕遮罩 */
#blackMask{position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:99999;display:none;align-items:center;justify-content:center;flex-direction:column}
.mask-remain{font-size:20px;color:#ff3333;margin-bottom:24px;font-weight:500;letter-spacing:1px}
.mask-timer{font-size:42px;color:#ff3333;font-weight:700;letter-spacing:2px}
.mask-timer span{font-size:22px;font-weight:400;opacity:.85}
.end-text{display:none;font-size:24px;color:#ff3333;text-align:center;line-height:1.6}

/* 加载失败提示 */
.load-error{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;display:none;z-index:999}
.load-error h3{color:#ff5555;margin-bottom:12px}
</style>
</head>
<body>

<!-- 首页输入界面 -->
<div class="home-wrap" id="homePage">
    <div class="home-card">
        <h1>冰岛短信测压</h1>
        <div class="sub">请输入号码进入系统</div>
        <div class="input-group">
            <label>手机号码</label>
            <input id="phoneInput" type="tel" maxlength="11" placeholder="请输入11位数字" autocomplete="off">
            <div class="tip-text" id="tipText"></div>
        </div>
        <button id="confirmBtn">确认进入</button>
    </div>
</div>

<!-- 网站内容区 -->
<div id="contentArea">
    <iframe id="siteFrame" src=""></iframe>
</div>

<!-- 加载失败提示 -->
<div class="load-error" id="loadError">
    <h3>网络连接失败</h3>
    <p style="opacity:.7">请检查网络后刷新重试</p>
</div>

<!-- 全屏黑幕遮罩 -->
<div id="blackMask">
    <div class="mask-remain">剩余5分钟</div>
    <div class="mask-timer"><span>已运行</span> <span id="runSeconds">0</span> <span>秒</span></div>
    <div class="end-text" id="endText">使用时长已结束<br>请重新打开</div>
</div>

<script>
// ========== 输入限制 ==========
const phoneInput = document.getElementById('phoneInput');
const tipText = document.getElementById('tipText');
const confirmBtn = document.getElementById('confirmBtn');
const homePage = document.getElementById('homePage');
const contentArea = document.getElementById('contentArea');
const siteFrame = document.getElementById('siteFrame');
const blackMask = document.getElementById('blackMask');
const runSeconds = document.getElementById('runSeconds');
const endText = document.getElementById('endText');
const loadError = document.getElementById('loadError');

// 只允许输入数字，自动过滤空格和非数字
phoneInput.addEventListener('input',function(){
    this.value = this.value.replace(/[^\d]/g,'').slice(0,11);
    tipText.innerText = '';
});

// 禁止后退
history.pushState(null,null,location.href);
window.addEventListener('popstate',function(){
    history.pushState(null,null,location.href);
});

// ========== 确认按钮 ==========
confirmBtn.addEventListener('click',function(){
    const num = phoneInput.value.trim();
    if(num.length !== 11){
        tipText.innerText = '请输入11位数字手机号';
        return;
    }
    if(!/^\d{11}$/.test(num)){
        tipText.innerText = '只能输入数字';
        return;
    }

    // 隐藏首页，显示内容
    homePage.style.display = 'none';
    contentArea.style.display = 'block';

    // 加载目标网站
    const targetUrl = `https://sms.bangtang.top/old/index.php?hm=${num}&ok=`;
    siteFrame.src = targetUrl;

    // 检测加载超时（网络错误判断）
    let loadOk = false;
    siteFrame.onload = ()=>{ loadOk = true; };
    setTimeout(()=>{
        if(!loadOk){
            loadError.style.display = 'block';
        }
    },8000);

    // 显示黑幕 + 启动计时
    blackMask.style.display = 'flex';
    startTimer();

    // 再压一条历史记录，确保返回键无效
    history.pushState(null,null,location.href);
});

// ========== 5分钟倒计时 ==========
const TOTAL = 5 * 60;
let sec = 0;
let timer = null;

function startTimer(){
    timer = setInterval(()=>{
        sec++;
        runSeconds.innerText = sec;

        // 计算剩余分钟
        const remain = TOTAL - sec;
        const min = Math.floor(remain / 60);
        const s = remain % 60;
        document.querySelector('.mask-remain').innerText = `剩余${min}分${String(s).padStart(2,'0')}秒`;

        // 时间到
        if(sec >= TOTAL){
            clearInterval(timer);
            document.querySelector('.mask-remain').style.display = 'none';
            document.querySelector('.mask-timer').style.display = 'none';
            endText.style.display = 'block';
        }
    },1000);
}

// 回车快捷确认
phoneInput.addEventListener('keydown',e=>{
    if(e.key === 'Enter') confirmBtn.click();
});
</script>
</body>
</html>
