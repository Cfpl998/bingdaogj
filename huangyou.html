<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,sans-serif}
body{
    min-height:100vh;
    background:url("https://rimg.zhuqiy.top/api/random?type=mb") center/cover no-repeat fixed;
    color:#fff;
    padding:20px;
    display:flex;
    flex-direction:column;
    align-items:center;
}

/* 欢迎卡片 */
.welcome-card{
    width:100%;
    max-width:720px;
    padding:28px 24px;
    margin-bottom:18px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(20px) saturate(180%);
    -webkit-backdrop-filter:blur(20px) saturate(180%);
    border:1px solid rgba(255,255,255,0.15);
    border-radius:18px;
    text-align:center;
}
.welcome-card h1{
    font-size:26px;
    font-weight:600;
    margin-bottom:8px;
    text-shadow:0 2px 10px rgba(0,0,0,0.3);
}
.welcome-card p{
    font-size:14px;
    opacity:0.75;
}

/* 搜索框 */
.search-box{
    width:100%;
    max-width:720px;
    margin-bottom:18px;
    display:flex;
    gap:10px;
}
.search-box input{
    flex:1;
    padding:14px 18px;
    background:rgba(255,255,255,0.1);
    backdrop-filter:blur(16px) saturate(180%);
    -webkit-backdrop-filter:blur(16px) saturate(180%);
    border:1px solid rgba(255,255,255,0.18);
    border-radius:12px;
    color:#fff;
    font-size:15px;
    outline:none;
}
.search-box input::placeholder{color:rgba(255,255,255,0.5)}
.search-box button{
    padding:0 22px;
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(16px) saturate(180%);
    -webkit-backdrop-filter:blur(16px) saturate(180%);
    border:1px solid rgba(255,255,255,0.2);
    border-radius:12px;
    color:#fff;
    font-size:15px;
    cursor:pointer;
    transition:all .25s;
}
.search-box button:hover{background:rgba(255,255,255,0.25)}

/* 按钮容器卡片 */
.btn-container{
    width:100%;
    max-width:720px;
    flex:1;
    max-height:calc(100vh - 260px);
    overflow-y:auto;
    padding:20px;
    background:rgba(255,255,255,0.05);
    backdrop-filter:blur(24px) saturate(180%);
    -webkit-backdrop-filter:blur(24px) saturate(180%);
    border:1px solid rgba(255,255,255,0.12);
    border-radius:18px;
    display:flex;
    flex-direction:column;
    gap:12px;
}
.btn-container::-webkit-scrollbar{width:4px}
.btn-container::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.2);border-radius:4px}

/* 长按钮 */
.nav-btn{
    display:block;
    width:100%;
    padding:16px 20px;
    text-align:left;
    text-decoration:none;
    color:#fff;
    font-size:15px;
    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(12px) saturate(180%);
    -webkit-backdrop-filter:blur(12px) saturate(180%);
    border:1px solid rgba(255,255,255,0.18);
    border-radius:12px;
    cursor:pointer;
    transition:all .3s ease;
    opacity:0;
    transform:scale(0.95);
    animation:fadeIn .4s ease forwards;
}
.nav-btn.hidden{
    display:none;
}
.nav-btn:hover{
    background:rgba(255,255,255,0.22);
    transform:translateY(-2px);
    box-shadow:0 8px 24px rgba(0,0,0,0.15);
}

@keyframes fadeIn{
    to{opacity:1;transform:scale(1)}
}

/* 按钮依次延迟入场 */
.nav-btn:nth-child(1){animation-delay:.05s}
.nav-btn:nth-child(2){animation-delay:.1s}
.nav-btn:nth-child(3){animation-delay:.15s}
.nav-btn:nth-child(4){animation-delay:.2s}
.nav-btn:nth-child(5){animation-delay:.25s}
.nav-btn:nth-child(6){animation-delay:.3s}
.nav-btn:nth-child(7){animation-delay:.35s}
.nav-btn:nth-child(8){animation-delay:.4s}
.nav-btn:nth-child(9){animation-delay:.45s}
.nav-btn:nth-child(10){animation-delay:.5s}
</style>

<script>
function doSearch(){
    const kw = document.getElementById('searchInput').value.trim().toLowerCase();
    const buttons = document.querySelectorAll('.nav-btn');
    buttons.forEach(btn=>{
        const text = btn.innerText.toLowerCase();
        if(text.includes(kw)){
            btn.classList.remove('hidden');
        }else{
            btn.classList.add('hidden');
        }
    });
}
document.getElementById('searchInput').addEventListener('keydown',e=>{
    if(e.key==='Enter') doSearch();
});

const box = document.getElementById('btnBox');
const observer = new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
        if(entry.isIntersecting){
            entry.target.style.opacity = '1';
            entry.target.style.transform = 'scale(1)';
        }
    });
},{threshold:0.1,root:box});

document.querySelectorAll('.nav-btn').forEach(btn=>observer.observe(btn));
</script>
