<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>色图调回</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
    --bg: #08080d;
    --surface: #101018;
    --accent: #e63946;
    --accent-dim: rgba(230,57,70,.12);
    --text: #e8e3da;
    --muted: #4a453e;
    --cube: 140px;
    --half: 70px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
}

body::before {
    content: '';
    position: fixed; inset: 0;
    background:
        radial-gradient(ellipse at 25% 30%, rgba(230,57,70,.04) 0%, transparent 55%),
        radial-gradient(ellipse at 75% 70%, rgba(50,60,180,.02) 0%, transparent 55%);
    pointer-events: none;
}

body::after {
    content: '';
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    opacity: .025;
    pointer-events: none;
}

/* ===== TITLE ===== */
h1 {
    font-family: 'Noto Serif SC', serif;
    font-weight: 900;
    font-size: 2rem;
    letter-spacing: .5em;
    text-indent: .5em;
    margin-bottom: 52px;
    position: relative;
    z-index: 1;
    opacity: 0;
    animation: up .7s ease .15s forwards;
}

h1::after {
    content: '';
    display: block;
    width: 36px;
    height: 1px;
    background: var(--accent);
    margin: 14px auto 0;
}

/* ===== SCENE ===== */
.scene {
    width: 280px;
    height: 200px;
    position: relative;
    z-index: 1;
    margin-bottom: 48px;
    perspective: 800px;
    opacity: 0;
    animation: up .7s ease .3s forwards;
}

/* ===== CUBE STAGE ===== */
.cw {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity .4s ease;
    z-index: 3;
}

.cw.off {
    opacity: 0;
    pointer-events: none;
}

.cube {
    width: var(--cube);
    height: var(--cube);
    transform-style: preserve-3d;
    position: relative;
    transform: rotateX(-18deg);
}

.face {
    position: absolute;
    width: var(--cube);
    height: var(--cube);
    background: var(--surface);
    border: 1px solid rgba(230,57,70,.06);
}

.face::before {
    content: '';
    position: absolute;
    inset: 28%;
    border: 1px solid rgba(230,57,70,.1);
    box-shadow: inset 0 0 12px rgba(230,57,70,.03);
}

.face::after {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    width: 4px; height: 4px;
    background: var(--accent);
    opacity: .12;
    transform: translate(-50%, -50%);
}

.front  { transform: translateZ(var(--half)); }
.back   { transform: rotateY(180deg) translateZ(var(--half)); }
.right  { transform: rotateY(90deg) translateZ(var(--half)); }
.left   { transform: rotateY(-90deg) translateZ(var(--half)); }
.top    { transform: rotateX(90deg) translateZ(var(--half)); }
.bottom { transform: rotateX(-90deg) translateZ(var(--half)); }

@keyframes spin {
    from { transform: rotateX(-18deg) rotateY(0); }
    to   { transform: rotateX(-18deg) rotateY(360deg); }
}

@keyframes spinOut {
    0%   { transform: rotateX(-18deg) rotateY(0) scale(1); opacity: 1; }
    50%  { transform: rotateX(-18deg) rotateY(400deg) scale(1.12); opacity: 1; }
    100% { transform: rotateX(0) rotateY(720deg) scale(0); opacity: 0; }
}

/* ===== IMAGE STAGE ===== */
.iw {
    position: absolute;
    inset: 0;
    background: var(--surface);
    border: 1px solid rgba(230,57,70,.07);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2;
    opacity: 0;
    transform: scale(.55);
    transition: opacity .6s ease, transform .65s cubic-bezier(.16,1,.3,1);
}

.iw.on {
    opacity: 1;
    transform: scale(1);
}

/* Corner viewfinder marks */
.iw::before, .iw::after {
    content: '';
    position: absolute;
    width: 14px;
    height: 14px;
    border-color: rgba(230,57,70,.14);
    border-style: solid;
    z-index: 10;
    pointer-events: none;
}

.iw::before {
    top: 10px; left: 10px;
    border-width: 1px 0 0 1px;
}

.iw::after {
    bottom: 10px; right: 10px;
    border-width: 0 1px 1px 0;
}

/* Loader */
.loader {
    position: absolute;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    z-index: 5;
    transition: opacity .35s ease;
}

.loader.off {
    opacity: 0;
    pointer-events: none;
}

.ring {
    width: 30px;
    height: 30px;
    border: 2px solid var(--accent-dim);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: rot .7s linear infinite;
}

@keyframes rot { to { transform: rotate(360deg); } }

.loader span {
    font-size: .68rem;
    color: var(--muted);
    letter-spacing: .2em;
}

.iw img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    transition: opacity .5s ease;
    position: relative;
    z-index: 2;
}

.iw img.vis { opacity: 1; }

/* ===== BUTTON ===== */
button {
    background: none;
    border: 1px solid rgba(230,57,70,.18);
    color: var(--accent);
    font-family: 'DM Mono', monospace;
    font-size: .78rem;
    padding: 11px 38px;
    cursor: pointer;
    letter-spacing: .18em;
    transition: all .3s ease;
    z-index: 1;
    opacity: 0;
    animation: up .7s ease .45s forwards;
}

button:hover {
    border-color: var(--accent);
    background: rgba(230,57,70,.03);
    letter-spacing: .28em;
    padding: 11px 48px;
}

button:active { transform: scale(.96); }
button:disabled { opacity: .18; cursor: not-allowed; }
button:disabled:hover {
    letter-spacing: .18em;
    padding: 11px 38px;
    border-color: rgba(230,57,70,.18);
    background: none;
}

@keyframes up {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
}

/* ===== RESPONSIVE ===== */
@media (max-width: 560px) {
    :root { --cube: 110px; --half: 55px; }
    h1 { font-size: 1.4rem; letter-spacing: .35em; text-indent: .35em; }
    button { font-size: .72rem; padding: 10px 28px; }
}
</style>
</head>
<body>

<h1>色图调回</h1>

<div class="scene" id="scene">
    <div class="cw" id="cw">
        <div class="cube" id="cb">
            <div class="face front"></div>
            <div class="face back"></div>
            <div class="face right"></div>
            <div class="face left"></div>
            <div class="face top"></div>
            <div class="face bottom"></div>
        </div>
    </div>
    <div class="iw" id="iw">
        <div class="loader" id="ld">
            <div class="ring"></div>
            <span>加载中</span>
        </div>
        <img id="pic" alt="">
    </div>
</div>

<button id="btn">刷新</button>

<script>
(() => {
    const API = 'https://moe.jitsu.top/img?sort=r18';
    const scene = document.getElementById('scene');
    const cw = document.getElementById('cw');
    const cb = document.getElementById('cb');
    const iw = document.getElementById('iw');
    const ld = document.getElementById('ld');
    const pic = document.getElementById('pic');
    const btn = document.getElementById('btn');

    const wait = ms => new Promise(r => setTimeout(r, ms));
    let busy = false, first = true;

    // Idle cube spin
    cb.style.animation = 'spin 12s linear infinite';

    btn.addEventListener('click', async () => {
        if (busy) return;
        busy = true;
        btn.disabled = true;

        if (first) {
            // ======== FIRST CLICK: Cube spin-out ========
            cb.style.animation = 'none';
            void cb.offsetWidth;
            cb.style.animation = 'spinOut .85s cubic-bezier(.22,1,.36,1) forwards';
            await wait(880);
            cw.classList.add('off');
            first = false;

            // Reveal image stage
            iw.classList.add('on');

        } else {
            // ======== SUBSEQUENT CLICKS ========
            // Fade out current image
            pic.classList.remove('vis');
            await wait(250);
            iw.classList.remove('on');
            await wait(400);

            // Reset image stage internals
            pic.src = '';
            ld.classList.remove('off');
            ld.querySelector('span').textContent = '加载中';
            ld.querySelector('.ring').style.animationPlayState = '';

            // Collapse scene back to compact size
            scene.style.transition = 'width .35s ease, height .35s ease';
            scene.style.width = '280px';
            scene.style.height = '200px';
            await wait(400);

            // Show image stage again with loader
            iw.classList.add('on');
        }

        // ======== FETCH IMAGE ========
        const img = new Image();
        const ready = new Promise((ok, no) => { img.onload = ok; img.onerror = no; });
        img.src = API + '&_=' + Date.now();

        try {
            await ready;

            // Calculate target dimensions from aspect ratio
            const ratio = img.naturalWidth / img.naturalHeight || 1.5;
            const maxW = Math.min(540, innerWidth * .88);
            const maxH = Math.min(400, innerHeight * .52);
            let w, h;
            if (ratio >= maxW / maxH) { w = maxW; h = w / ratio; }
            else { h = maxH; w = h * ratio; }

            // Expand scene to match image aspect ratio
            scene.style.transition =
                'width .55s cubic-bezier(.16,1,.3,1), height .55s cubic-bezier(.16,1,.3,1)';
            scene.style.width = w + 'px';
            scene.style.height = h + 'px';

            // Swap in the loaded image
            pic.src = img.src;
            await wait(150);
            ld.classList.add('off');
            await wait(300);
            pic.classList.add('vis');

        } catch {
            ld.querySelector('span').textContent = '加载失败，点击重试';
            ld.querySelector('.ring').style.animationPlayState = 'paused';
        }

        busy = false;
        btn.disabled = false;
    });
})();
</script>
</body>
</html>
