<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>快手分享工具</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================
   ROOT VARIABLES
   ============================================ */
:root {
  --bg: #08080c;
  --surface: rgba(255,255,255,0.025);
  --surface-hover: rgba(255,255,255,0.045);
  --border: rgba(255,255,255,0.06);
  --border-focus: rgba(0,229,195,0.35);
  --accent: #00e5c3;
  --accent-dim: rgba(0,229,195,0.08);
  --accent-glow: rgba(0,229,195,0.25);
  --text: #e8e6e1;
  --text-mid: #8a8680;
  --text-dim: #4a4840;
  --error: #ff4757;
  --error-dim: rgba(255,71,87,0.1);
  --error-glow: rgba(255,71,87,0.25);
  --warn: #ffb347;
  --info: #64b5f6;
  --radius: 16px;
  --radius-sm: 10px;
}

/* ============================================
   RESET & BASE
   ============================================ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{
  font-family:'DM Mono',monospace;
  font-weight:400;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  overflow-x:hidden;
  line-height:1.6;
}
input,button{font-family:inherit}
::selection{background:var(--accent);color:var(--bg)}

/* ============================================
   SCROLLBAR
   ============================================ */
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.08);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,0.14)}

/* ============================================
   BACKGROUND ORBS
   ============================================ */
.bg-orbs{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(120px);will-change:transform}
.orb-1{width:600px;height:600px;background:radial-gradient(circle,rgba(0,229,195,0.18),transparent 70%);top:-180px;left:-120px;animation:drift1 22s ease-in-out infinite}
.orb-2{width:450px;height:450px;background:radial-gradient(circle,rgba(100,80,220,0.14),transparent 70%);bottom:-100px;right:-80px;animation:drift2 28s ease-in-out infinite}
.orb-3{width:380px;height:380px;background:radial-gradient(circle,rgba(0,150,230,0.12),transparent 70%);top:45%;left:50%;animation:drift3 25s ease-in-out infinite}
@keyframes drift1{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(60px,40px) scale(1.05)}66%{transform:translate(-30px,70px) scale(0.95)}}
@keyframes drift2{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(-50px,-30px) scale(1.08)}66%{transform:translate(40px,-60px) scale(0.92)}}
@keyframes drift3{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-70px,50px) scale(1.1)}}

/* ============================================
   APP LAYOUT
   ============================================ */
.app{
  position:relative;z-index:1;
  max-width:720px;margin:0 auto;
  padding:20px 20px 60px;
}

/* ============================================
   HEADER
   ============================================ */
.header{text-align:center;padding:40px 0 36px}
.header .badge{
  display:inline-block;
  padding:4px 14px;
  background:var(--accent-dim);
  border:1px solid rgba(0,229,195,0.15);
  border-radius:20px;
  color:var(--accent);
  font-size:11px;font-weight:500;
  letter-spacing:0.12em;
  text-transform:uppercase;
  margin-bottom:16px;
}
.header h1{
  font-family:'Syne',sans-serif;
  font-size:clamp(2rem,5vw,3.2rem);
  font-weight:800;
  line-height:1.15;
  background:linear-gradient(135deg,#e8e6e1 20%,var(--accent) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
}
.header .subtitle{
  margin-top:10px;
  font-size:13px;font-weight:300;
  color:var(--text-dim);
  letter-spacing:0.18em;
}

/* ============================================
   GLASS CARD
   ============================================ */
.glass-card{
  background:linear-gradient(145deg,rgba(255,255,255,0.035),rgba(255,255,255,0.01));
  backdrop-filter:blur(24px) saturate(140%);
  -webkit-backdrop-filter:blur(24px) saturate(140%);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:24px;
  position:relative;
  overflow:hidden;
  margin-bottom:16px;
}
.glass-card::before{
  content:'';position:absolute;
  top:0;left:20%;right:20%;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.08),transparent);
}

/* ============================================
   FORM FIELDS
   ============================================ */
.field{margin-bottom:18px}
.field:last-child{margin-bottom:0}
.field-label{
  display:block;
  font-size:12px;font-weight:500;
  color:var(--text-mid);
  letter-spacing:0.06em;
  margin-bottom:8px;
}
.field-hint{color:var(--text-dim);font-weight:300;font-size:11px}
.field-input{
  width:100%;height:46px;
  padding:0 16px;
  background:rgba(255,255,255,0.025);
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  color:var(--text);
  font-size:13px;font-weight:400;
  outline:none;
  transition:all .25s ease;
}
.field-input::placeholder{color:var(--text-dim);font-weight:300}
.field-input:hover{border-color:rgba(255,255,255,0.12);background:rgba(255,255,255,0.035)}
.field-input:focus{
  border-color:var(--border-focus);
  background:var(--accent-dim);
  box-shadow:0 0 0 3px rgba(0,229,195,0.06);
}
.field-input[type=number]{-moz-appearance:textfield}
.field-input[type=number]::-webkit-inner-spin-button,
.field-input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}

.field-row{display:flex;gap:10px;align-items:flex-end}
.field-row .field{flex:1;margin-bottom:0}

.row-split{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row-split .field{margin-bottom:0}

.link-row{display:flex;gap:8px;align-items:flex-end}
.link-row .field-input{flex:1}
.btn-parse{
  flex-shrink:0;height:46px;padding:0 20px;
  background:rgba(255,255,255,0.04);
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  color:var(--text-mid);
  font-size:13px;font-weight:500;
  cursor:pointer;transition:all .2s ease;
}
.btn-parse:hover{background:var(--accent-dim);color:var(--accent);border-color:rgba(0,229,195,0.2)}
.btn-parse:active{transform:scale(0.97)}

.demo-row{
  display:flex;align-items:center;gap:8px;
  margin-top:14px;padding-top:14px;
  border-top:1px solid var(--border);
}
.demo-row label{font-size:12px;color:var(--text-dim);cursor:pointer;user-select:none}
.demo-row input[type=checkbox]{
  width:16px;height:16px;cursor:pointer;
  accent-color:var(--accent);
}

/* ============================================
   BUTTONS
   ============================================ */
.controls{display:flex;gap:12px;margin-bottom:16px;padding:0 4px}
.btn-start,.btn-stop{display:flex;align-items:center;justify-content:center;gap:8px;height:50px;border:none;border-radius:var(--radius-sm);font-size:14px;font-weight:600;cursor:pointer;transition:all .25s cubic-bezier(.22,1,.36,1);letter-spacing:0.03em}
.btn-start{
  flex:1;
  background:linear-gradient(135deg,#00e5c3,#00c9a8);
  color:#08080c;
  box-shadow:0 4px 24px rgba(0,229,195,0.25);
}
.btn-start:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 36px rgba(0,229,195,0.35)}
.btn-start:active:not(:disabled){transform:translateY(0) scale(0.98)}
.btn-start:disabled{opacity:0.35;cursor:not-allowed;transform:none;box-shadow:none}

.btn-stop{
  width:110px;
  background:var(--error-dim);
  color:var(--error);
  border:1px solid rgba(255,71,87,0.15);
}
.btn-stop:hover:not(:disabled){background:rgba(255,71,87,0.18);border-color:rgba(255,71,87,0.3)}
.btn-stop:disabled{opacity:0.3;cursor:not-allowed}

.btn-icon{font-size:12px;line-height:1}

/* ============================================
   STATUS & PROGRESS
   ============================================ */
.status-section{padding:20px 24px;margin-bottom:16px}
.status-header{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.status-dot{
  width:8px;height:8px;
  border-radius:50%;
  background:var(--text-dim);
  transition:all .3s ease;
  flex-shrink:0;
}
.status-dot.running{background:var(--accent);animation:pulse-dot 1.5s ease-in-out infinite}
.status-dot.done{background:var(--accent)}
.status-dot.stopped{background:var(--error)}
@keyframes pulse-dot{0%,100%{box-shadow:0 0 0 0 var(--accent-glow)}50%{box-shadow:0 0 0 8px transparent}}
.status-text{font-size:13px;font-weight:500;color:var(--text-mid);letter-spacing:0.04em}

.progress-wrap{position:relative}
.progress-track{
  height:6px;
  background:rgba(255,255,255,0.05);
  border-radius:3px;
  overflow:hidden;
}
.progress-fill{
  height:100%;width:0%;
  background:linear-gradient(90deg,var(--accent),#00ffd5);
  border-radius:3px;
  transition:width .35s cubic-bezier(.22,1,.36,1);
  position:relative;
}
.progress-fill::after{
  content:'';position:absolute;
  right:0;top:50%;transform:translateY(-50%);
  width:12px;height:12px;
  background:var(--accent);
  border-radius:50%;
  box-shadow:0 0 12px var(--accent-glow);
  opacity:0;transition:opacity .3s ease;
}
.progress-fill.active::after{opacity:1}

.progress-info{
  display:flex;justify-content:space-between;
  margin-top:8px;
  font-size:11px;color:var(--text-dim);
  letter-spacing:0.04em;
}

/* ============================================
   STATS GRID
   ============================================ */
.stats-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(120px,1fr));
  gap:12px;
  margin-bottom:16px;
}
.stat-card{padding:16px;text-align:center;margin-bottom:0}
.stat-card::before{display:none}
.stat-card .stat-label{
  font-size:10px;font-weight:500;
  color:var(--text-dim);
  text-transform:uppercase;
  letter-spacing:0.1em;
  margin-bottom:6px;
}
.stat-card .stat-value{
  font-size:17px;font-weight:500;
  color:var(--text);
  word-break:break-all;
}
.stat-card.is-success .stat-value{color:var(--accent)}
.stat-card.is-error .stat-value{color:var(--error)}

/* ============================================
   LOG SECTION
   ============================================ */
.log-section{padding:0;overflow:hidden}
.log-header{
  display:flex;justify-content:space-between;align-items:center;
  padding:16px 24px;
  border-bottom:1px solid var(--border);
}
.log-title{font-size:12px;font-weight:500;color:var(--text-mid);letter-spacing:0.08em;text-transform:uppercase}
.btn-clear{
  background:none;border:none;
  color:var(--text-dim);font-size:12px;
  cursor:pointer;transition:color .2s;
  font-family:inherit;
}
.btn-clear:hover{color:var(--text)}
.log-body{
  height:340px;
  overflow-y:auto;
  padding:12px 24px;
  font-size:12px;
  line-height:1.9;
}
.log-body .log-empty{
  display:flex;align-items:center;justify-content:center;
  height:100%;color:var(--text-dim);font-size:13px;
}
.log-entry{display:flex;gap:8px;padding:1px 0}
.log-time{color:var(--text-dim);flex-shrink:0;font-size:11px;margin-top:2px}
.log-msg{word-break:break-all}
.log-msg.info{color:var(--info)}
.log-msg.success{color:var(--accent)}
.log-msg.error{color:var(--error)}
.log-msg.warn{color:var(--warn)}
.log-msg.muted{color:var(--text-dim)}

/* ============================================
   STAGGER ANIMATIONS
   ============================================ */
.app>*{opacity:0;animation:fadeUp .65s cubic-bezier(.22,1,.36,1) forwards}
.app>*:nth-child(1){animation-delay:.05s}
.app>*:nth-child(2){animation-delay:.1s}
.app>*:nth-child(3){animation-delay:.15s}
.app>*:nth-child(4){animation-delay:.2s}
.app>*:nth-child(5){animation-delay:.25s}
.app>*:nth-child(6){animation-delay:.3s}
.app>*:nth-child(7){animation-delay:.35s}
@keyframes fadeUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}

/* ============================================
   RESPONSIVE
   ============================================ */
@media(max-width:640px){
  .app{padding:12px 14px 48px}
  .header{padding:28px 0 24px}
  .header h1{font-size:1.8rem}
  .glass-card{padding:18px;border-radius:14px}
  .field-input{height:44px;font-size:13px}
  .btn-parse{height:44px;padding:0 14px;font-size:12px}
  .btn-start,.btn-stop{height:46px;font-size:13px}
  .row-split{grid-template-columns:1fr 1fr}
  .stats-grid{grid-template-columns:repeat(3,1fr);gap:8px}
  .stat-card{padding:12px 8px}
  .stat-card .stat-value{font-size:15px}
  .log-body{height:260px}
  .status-section{padding:16px 18px}
}
@media(max-width:380px){
  .stats-grid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>

<!-- Background Orbs -->
<div class="bg-orbs">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
</div>

<!-- App -->
<main class="app">

  <!-- Header -->
  <header class="header">
    <div class="badge">v2.0 standalone</div>
    <h1>快手分享工具</h1>
    <p class="subtitle">自动化分享 · 实时监控 · 高效执行</p>
  </header>

  <!-- Input Card -->
  <section class="glass-card">
    <div class="field">
      <label class="field-label">快手作品链接</label>
      <div class="link-row">
        <input type="text" id="linkInput" class="field-input" placeholder="粘贴快手分享链接（短链）" autocomplete="off">
        <button class="btn-parse" id="parseBtn" onclick="parseLink()">解析</button>
      </div>
    </div>
    <div class="field">
      <label class="field-label">作品 ID <span class="field-hint">（自动解析或手动输入）</span></label>
      <input type="text" id="photoIdInput" class="field-input" placeholder="解析后自动填入，也可手动输入">
    </div>
    <div class="row-split">
      <div class="field">
        <label class="field-label">分享次数</label>
        <input type="number" id="countInput" class="field-input" value="100" min="1" max="99999">
      </div>
      <div class="field">
        <label class="field-label">并发数</label>
        <input type="number" id="concurrencyInput" class="field-input" value="50" min="1" max="200">
      </div>
    </div>
    <div class="field">
      <label class="field-label">后端 API 地址 <span class="field-hint">（你的后端服务地址）</span></label>
      <input type="text" id="backendUrlInput" class="field-input" placeholder="http://localhost:8080">
    </div>
    <div class="demo-row">
      <input type="checkbox" id="demoMode">
      <label for="demoMode">演示模式（无需后端，模拟执行）</label>
    </div>
  </section>

  <!-- Controls -->
  <div class="controls">
    <button class="btn-start" id="startBtn" onclick="handleStart()">
      <span class="btn-icon">&#9654;</span><span>开始执行</span>
    </button>
    <button class="btn-stop" id="stopBtn" onclick="handleStop()" disabled>
      <span class="btn-icon">&#9632;</span><span>停止</span>
    </button>
  </div>

  <!-- Status -->
  <section class="glass-card status-section">
    <div class="status-header">
      <span class="status-dot" id="statusDot"></span>
      <span class="status-text" id="statusText">等待执行</span>
    </div>
    <div class="progress-wrap">
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>
    <div class="progress-info">
      <span id="progressLeft">就绪</span>
      <span id="progressRight">0%</span>
    </div>
  </section>

  <!-- Stats -->
  <div class="stats-grid">
    <div class="glass-card stat-card">
      <div class="stat-label">开始时间</div>
      <div class="stat-value" id="sStart">--:--:--</div>
    </div>
    <div class="glass-card stat-card">
      <div class="stat-label">结束时间</div>
      <div class="stat-value" id="sEnd">--:--:--</div>
    </div>
    <div class="glass-card stat-card is-success">
      <div class="stat-label">成功</div>
      <div class="stat-value" id="sSuccess">0</div>
    </div>
    <div class="glass-card stat-card is-error">
      <div class="stat-label">失败</div>
      <div class="stat-value" id="sFailed">0</div>
    </div>
    <div class="glass-card stat-card">
      <div class="stat-label">耗时</div>
      <div class="stat-value" id="sDuration">--</div>
    </div>
  </div>

  <!-- Log -->
  <section class="glass-card log-section">
    <div class="log-header">
      <span class="log-title">执行日志</span>
      <button class="btn-clear" onclick="clearLog()">清空</button>
    </div>
    <div class="log-body" id="logBody">
      <div class="log-empty" id="logEmpty">暂无日志</div>
    </div>
  </section>

</main>

<script>
/* ============================================
   STATE
   ============================================ */
let isRunning = false;
let abortController = null;
let startTime = null;
let timerInterval = null;
let completedCount = 0;
let successCount = 0;
let failedCount = 0;

/* ============================================
   DOM REFS
   ============================================ */
const $ = id => document.getElementById(id);

/* ============================================
   UTILITIES
   ============================================ */
function now() {
  return new Date().toLocaleTimeString('zh-CN', { hour12: false });
}

function fmtTime(ts) {
  return new Date(ts).toLocaleTimeString('zh-CN', { hour12: false });
}

function fmtDuration(ms) {
  const s = Math.floor(ms / 1000);
  if (s < 60) return s + ' 秒';
  const m = Math.floor(s / 60);
  const rs = s % 60;
  if (m < 60) return m + ' 分 ' + rs + ' 秒';
  const h = Math.floor(m / 60);
  return h + ' 时 ' + (m % 60) + ' 分';
}

function getBackendUrl() {
  let url = $('backendUrlInput').value.trim();
  if (!url) return '';
  if (!url.startsWith('http://') && !url.startsWith('https://')) url = 'http://' + url;
  return url.replace(/\/+$/, '');
}

function isDemo() {
  return $('demoMode').checked;
}

/* ============================================
   LOG
   ============================================ */
function addLog(msg, type) {
  type = type || 'info';
  const body = $('logBody');
  const empty = $('logEmpty');
  if (empty) empty.remove();

  const atBottom = body.scrollHeight - body.scrollTop <= body.clientHeight + 30;

  const entry = document.createElement('div');
  entry.className = 'log-entry';
  entry.innerHTML =
    '<span class="log-time">' + now() + '</span>' +
    '<span class="log-msg ' + type + '">' + msg + '</span>';
  body.appendChild(entry);

  if (atBottom) body.scrollTop = body.scrollHeight;
}

function clearLog() {
  const body = $('logBody');
  body.innerHTML = '<div class="log-empty" id="logEmpty">暂无日志</div>';
}

/* ============================================
   UI UPDATES
   ============================================ */
function updateProgress(completed, total, success, failed) {
  completedCount = completed;
  successCount = success;
  failedCount = failed;
  const pct = total > 0 ? Math.round((completed / total) * 100) : 0;
  $('progressFill').style.width = pct + '%';
  if (isRunning) $('progressFill').classList.add('active');
  $('progressLeft').textContent = completed + ' / ' + total;
  $('progressRight').textContent = pct + '%';
  $('sSuccess').textContent = success;
  $('sFailed').textContent = failed;
}

function updateDuration() {
  if (!startTime) return;
  const elapsed = Date.now() - startTime;
  $('sDuration').textContent = fmtDuration(elapsed);
}

function setRunningState(running) {
  isRunning = running;
  $('startBtn').disabled = running;
  $('stopBtn').disabled = !running;
  $('parseBtn').disabled = running;
  $('linkInput').disabled = running;
  $('photoIdInput').disabled = running;
  $('countInput').disabled = running;
  $('concurrencyInput').disabled = running;
  $('backendUrlInput').disabled = running;
  $('demoMode').disabled = running;

  const dot = $('statusDot');
  dot.className = 'status-dot';
  if (running) {
    dot.classList.add('running');
    $('statusText').textContent = '执行中...';
    $('progressFill').classList.add('active');
  }
}

function resetStats() {
  $('sStart').textContent = '--:--:--';
  $('sEnd').textContent = '--:--:--';
  $('sSuccess').textContent = '0';
  $('sFailed').textContent = '0';
  $('sDuration').textContent = '--';
  $('progressFill').style.width = '0%';
  $('progressFill').classList.remove('active');
  $('progressLeft').textContent = '就绪';
  $('progressRight').textContent = '0%';
  $('statusText').textContent = '等待执行';
  $('statusDot').className = 'status-dot';
  completedCount = 0;
  successCount = 0;
  failedCount = 0;
}

/* ============================================
   PARSE LINK
   ============================================ */
async function parseLink() {
  const link = $('linkInput').value.trim();
  if (!link) { addLog('请先输入快手作品链接', 'warn'); return; }

  if (isDemo()) {
    const fakeId = 'demo_' + Math.random().toString(36).slice(2, 12);
    $('photoIdInput').value = fakeId;
    addLog('[演示] 解析成功，作品ID: ' + fakeId, 'success');
    return;
  }

  const backend = getBackendUrl();
  if (!backend) { addLog('请先填写后端 API 地址，或开启演示模式', 'warn'); return; }

  addLog('正在解析链接...', 'info');
  $('parseBtn').disabled = true;

  try {
    const res = await fetch(backend + '/api/parse', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ link: link })
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (data.success && data.photo_id) {
      $('photoIdInput').value = data.photo_id;
      addLog('解析成功，作品ID: ' + data.photo_id, 'success');
    } else {
      addLog('解析失败: ' + (data.message || '后端未返回ID'), 'error');
      addLog('请手动输入作品ID', 'warn');
    }
  } catch (e) {
    addLog('解析请求失败: ' + e.message, 'error');
    addLog('请检查后端地址或手动输入作品ID', 'warn');
  } finally {
    if (isRunning) return;
    $('parseBtn').disabled = false;
  }
}

/* ============================================
   DEMO SIMULATION
   ============================================ */
function simulateShare() {
  return new Promise(resolve => {
    const delay = Math.random() * 600 + 150;
    setTimeout(() => {
      resolve({ success: Math.random() > 0.08 });
    }, delay);
  });
}

/* ============================================
   REAL API CALL
   ============================================ */
async function realShare(backend, photoId, signal) {
  const res = await fetch(backend + '/api/share', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ photo_id: photoId }),
    signal: signal
  });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return await res.json();
}

/* ============================================
   EXECUTION ENGINE
   ============================================ */
async function execute(photoId, total, concurrency, backend) {
  const queue = [];
  for (let i = 0; i < total; i++) queue.push(i);

  let completed = 0, success = 0, failed = 0;
  const demo = isDemo();
  const signal = abortController.signal;
  const workerCount = Math.min(concurrency, total);
  const milestoneSet = new Set([
    Math.floor(total * 0.25),
    Math.floor(total * 0.5),
    Math.floor(total * 0.75),
    total
  ]);

  const workers = [];
  for (let w = 0; w < workerCount; w++) {
    workers.push((async () => {
      while (queue.length > 0 && isRunning) {
        const idx = queue.shift();
        if (idx === undefined) break;

        try {
          let result;
          if (demo) {
            result = await simulateShare();
          } else {
            result = await realShare(backend, photoId, signal);
          }

          if (result && result.success) {
            success++;
            if (success <= 10 || success % 10 === 0) {
              addLog('[成功] #' + success, 'success');
            }
          } else {
            failed++;
            addLog('[失败] #' + (completed + 1) + (result && result.message ? ': ' + result.message : ''), 'error');
          }
        } catch (e) {
          if (e.name === 'AbortError') break;
          failed++;
          addLog('[错误] #' + (completed + 1) + ': ' + e.message, 'error');
        }

        completed++;

        // Milestone log
        if (milestoneSet.has(completed)) {
          const pct = Math.round((completed / total) * 100);
          addLog('--- 进度 ' + pct + '% (' + completed + '/' + total + ') ---', 'muted');
        }

        updateProgress(completed, total, success, failed);
      }
    })());
  }

  await Promise.all(workers);
  return { completed, success, failed };
}

/* ============================================
   START / STOP HANDLERS
   ============================================ */
async function handleStart() {
  const photoId = $('photoIdInput').value.trim();
  const count = parseInt($('countInput').value);
  const concurrency = parseInt($('concurrencyInput').value);
  const demo = isDemo();
  let backend = getBackendUrl();

  // Validation
  if (!photoId) { addLog('请输入作品ID', 'warn'); $('photoIdInput').focus(); return; }
  if (!count || count <= 0) { addLog('请输入有效的分享次数', 'warn'); $('countInput').focus(); return; }
  if (count > 99999) { addLog('分享次数不能超过 99999', 'warn'); return; }
  if (!concurrency || concurrency <= 0) { addLog('并发数必须大于 0', 'warn'); return; }
  if (!demo && !backend) { addLog('请输入后端 API 地址，或开启演示模式', 'warn'); $('backendUrlInput').focus(); return; }

  // Reset
  resetStats();
  abortController = new AbortController();
  startTime = Date.now();

  setRunningState(true);
  $('sStart').textContent = fmtTime(startTime);
  timerInterval = setInterval(updateDuration, 1000);

  addLog('==============================', 'muted');
  addLog('开始执行 | 作品ID: ' + photoId + ' | 总数: ' + count + ' | 并发: ' + concurrency + (demo ? ' | 演示模式' : ''), 'info');
  addLog('==============================', 'muted');

  const result = await execute(photoId, count, concurrency, backend);

  // Done
  isRunning = false;
  clearInterval(timerInterval);
  updateDuration();

  const endTime = Date.now();
  $('sEnd').textContent = fmtTime(endTime);
  $('sDuration').textContent = fmtDuration(endTime - startTime);
  $('progressFill').classList.remove('active');

  const dot = $('statusDot');
  dot.className = 'status-dot';

  if (result.completed >= count) {
    dot.classList.add('done');
    $('statusText').textContent = '执行完成';
    addLog('==============================', 'muted');
    addLog('执行完成 | 成功: ' + result.success + ' | 失败: ' + result.failed + ' | 耗时: ' + fmtDuration(endTime - startTime), 'success');
    addLog('==============================', 'muted');
  } else {
    dot.classList.add('stopped');
    $('statusText').textContent = '已停止';
    addLog('==============================', 'muted');
    addLog('已停止 | 完成: ' + result.completed + '/' + count + ' | 成功: ' + result.success + ' | 失败: ' + result.failed, 'warn');
    addLog('==============================', 'muted');
  }

  $('startBtn').disabled = false;
  $('stopBtn').disabled = true;
  $('parseBtn').disabled = false;
  $('linkInput').disabled = false;
  $('photoIdInput').disabled = false;
  $('countInput').disabled = false;
  $('concurrencyInput').disabled = false;
  $('backendUrlInput').disabled = false;
  $('demoMode').disabled = false;
}

function handleStop() {
  if (!isRunning) return;
  addLog('正在停止...', 'warn');
  isRunning = false;
  if (abortController) abortController.abort();
}

/* ============================================
   KEYBOARD SHORTCUTS
   ============================================ */
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
    e.preventDefault();
    if (!isRunning) handleStart();
  }
  if (e.key === 'Escape' && isRunning) {
    handleStop();
  }
});

$('linkInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); parseLink(); }
});

/* ============================================
   INIT
   ============================================ */
(function init() {
  // Auto-detect backend URL from current page origin
  const origin = window.location.origin;
  if (origin && origin !== 'null') {
    $('backendUrlInput').placeholder = origin;
  }
  addLog('工具就绪，请输入参数后点击「开始执行」', 'muted');
  addLog('快捷键: Ctrl+Enter 开始 | Esc 停止', 'muted');
})();
</script>
